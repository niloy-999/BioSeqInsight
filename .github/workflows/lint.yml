name: lint

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: ruff
        run: ruff check src tests benchmarks
        continue-on-error: true

      - name: black
        run: black --check src tests benchmarks

      - name: mypy
        run: mypy src/bioseqinsight
        continue-on-error: true   # advisory while type coverage is completed

  docs:
    name: documentation checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Every public module has a docstring
        run: |
          python - <<'PY'
          import ast, pathlib, sys
          bad = []
          for path in pathlib.Path("src").rglob("*.py"):
              if ast.get_docstring(ast.parse(path.read_text(encoding="utf-8"))) is None:
                  bad.append(str(path))
          if bad:
              sys.exit("Modules without a docstring:\n  " + "\n  ".join(bad))
          print("all modules documented")
          PY

      - name: Documented files exist
        run: |
          for f in README.md CHANGELOG.md LICENSE CITATION.cff CONTRIBUTING.md \
                   docs/installation.md docs/user-guide.md docs/developer-guide.md \
                   docs/architecture.md docs/benchmarking.md docs/mapping-levels.md \
                   benchmarks/protocols/usability_study_protocol.md \
                   benchmarks/protocols/manual_workflow_protocol.md; do
            test -f "$f" || { echo "missing: $f"; exit 1; }
          done
          echo "documentation set complete"

      - name: Version numbers agree
        run: |
          python - <<'PY'
          import re, pathlib, sys, tomllib
          init = pathlib.Path("src/bioseqinsight/__init__.py").read_text()
          version = re.search(r'__version__\s*=\s*"([^"]+)"', init).group(1)
          pyproject = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          citation = pathlib.Path("CITATION.cff").read_text()
          cff = re.search(r'^version:\s*"?([^"\n]+)"?', citation, re.M).group(1).strip()
          if not (version == pyproject == cff):
              sys.exit(f"version mismatch: __init__={version} pyproject={pyproject} CITATION={cff}")
          print(f"version {version} consistent across __init__.py, pyproject.toml and CITATION.cff")
          PY
